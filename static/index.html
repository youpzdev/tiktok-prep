<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Prep</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="brand-name">TIKTOK PREP</span>
    <span class="brand-sub" data-i18n="brand_sub">компрессия и маскировка контейнера</span>
  </div>
  <div class="bar-right">
    <div class="engine" id="engine">
      <span class="dot" aria-hidden="true"></span>
      <span id="engine-text" data-i18n="engine_check">проверка движка</span>
    </div>
    <div class="seg" id="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main class="work">

  <section class="panel modes" aria-labelledby="modes-title">
    <h2 id="modes-title" class="panel-title" data-i18n="modes_title">режим</h2>
    <div class="mode-list" id="modes"></div>
  </section>

  <section class="panel main" aria-labelledby="queue-title">
    <div class="panel-head">
      <h2 id="queue-title" class="panel-title">
        <span data-i18n="queue_title">очередь</span>
        <span class="count" id="queue-count">0</span>
      </h2>
      <div class="head-actions">
        <button type="button" class="btn" id="btn-files" data-i18n="btn_files">файлы</button>
        <button type="button" class="btn" id="btn-folder" data-i18n="btn_folder">папка</button>
        <button type="button" class="btn ghost" id="btn-clear" data-i18n="btn_clear">очистить</button>
        <button type="button" class="btn primary" id="btn-start" data-i18n="btn_start">старт</button>
      </div>
    </div>

    <p class="notice" id="notice" role="status" hidden></p>
    <p class="upload mono" id="upload" role="status" hidden></p>

    <div class="jobline" id="jobline" hidden>
      <div class="jobbar"><div class="jobbar-fill" id="jobbar-fill"></div></div>
      <span class="jobtext mono" id="jobtext"></span>
    </div>

    <div class="queue-scroll">
      <ol class="queue" id="queue" aria-live="polite"></ol>
      <div class="empty" id="empty">
        <p class="empty-title" data-i18n="empty_title">перетащи видео в окно</p>
        <p class="empty-hint" data-i18n="empty_hint">mp4, mov, mkv, webm и другие. на выходе mp4 в папке tiktok_ready рядом с исходником</p>
      </div>
    </div>

    <div class="result" id="result" hidden>
      <span class="result-text mono" id="result-text"></span>
      <button type="button" class="btn" id="btn-open" data-i18n="btn_open">открыть папку</button>
    </div>
  </section>

</main>

<footer class="foot mono">
  <span id="foot-engine"></span>
  <span id="foot-out"></span>
</footer>

<div class="drop-veil" id="drop-veil" hidden>
  <span data-i18n="drop_now">отпускай</span>
</div>

<script src="/app.js"></script>
</body>
</html>
